<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101525">
  <title>The City That Lost Its Thought</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: Nunito,Inter,system-ui,sans-serif; --cyan:#38bdf8; --panel:rgba(10,17,32,.88); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; background:#090d18; color:#fff; }
    body { min-height:100vh; display:grid; place-items:center; padding:0; overflow:hidden; }
    button { font:inherit; }
    .game { position:relative; isolation:isolate; width:min(100vw,1100px); height:min(100vh,820px); min-height:520px; overflow:hidden; background:#162136; box-shadow:0 24px 80px #0009; }
    .backdrop { position:absolute; inset:0; z-index:-2; background-color:#162136; background-position:center; background-size:cover; transition:background-image .35s ease,filter .4s ease; }
    .backdrop::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,9,20,.25),rgba(4,9,20,.05) 35%,rgba(4,9,20,.45)); }
    .bg-city-day { background-image:url('1.png'); }
    .bg-classroom { background-image:url('2.png'); }
    .bg-lab { background-image:url('3.png'); }
    .bg-park { background-image:url('4.png'); }
    .bg-blackout { background-image:url('5.png'); filter:saturate(.6) brightness(.62); }
    .bg-connection-lost { background-image:url('6.png'); }
    .bg-ruins { background-image:url('7.png'); }
    .bg-future { background-image:url('8.png'); }
    .hud { position:absolute; z-index:3; top:0; left:0; right:0; display:flex; flex-wrap:wrap; justify-content:center; gap:9px; padding:15px; background:linear-gradient(#050914b8,transparent); }
    .stat { display:flex; gap:8px; align-items:center; padding:7px 13px; border:1px solid #ffffff44; border-radius:999px; background:#101a2bd9; font-size:.86rem; font-weight:800; box-shadow:0 4px 14px #0004; }
    .stat b { color:#7dd3fc; font-size:1rem; }
    .stat.thinking b { color:#86efac; }
    .scene-title { position:absolute; top:72px; left:50%; transform:translateX(-50%); padding:5px 12px; border-radius:999px; background:#07101dbd; color:#e0f2fe; font-size:.78rem; white-space:nowrap; letter-spacing:.04em; }
    .spark { position:absolute; left:50%; top:34%; width:clamp(145px,24vw,210px); aspect-ratio:1; transform:translateX(-50%); animation:float 4s ease-in-out infinite; filter:drop-shadow(0 15px 20px #0008); }
    .spark.hidden { display:none; }
    .spark svg { width:100%; height:100%; overflow:visible; }
    @keyframes float { 0%,100%{translate:0 0} 50%{translate:0 -14px} }
    .bottom-ui { position:absolute; z-index:2; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:13px; padding:22px clamp(14px,4vw,36px) max(20px,env(safe-area-inset-bottom)); background:linear-gradient(transparent,#05091450 12%,#05091488); }
    .choices { width:min(100%,760px); display:grid; gap:9px; }
    .choice { width:100%; text-align:left; color:white; padding:12px 16px; border-radius:12px; border:1px solid #cbd5e188; background:rgba(15,26,44,.94); cursor:pointer; font-weight:700; line-height:1.35; transition:transform .16s,background .16s,border-color .16s; box-shadow:0 7px 18px #0005; }
    .choice:hover,.choice:focus-visible { transform:translateX(5px); background:#0c749b; border-color:#bae6fd; outline:none; }
    .dialog { position:relative; width:min(100%,900px); min-height:112px; padding:24px 24px 19px; border:3px solid var(--cyan); border-radius:17px; background:var(--panel); backdrop-filter:blur(10px); box-shadow:0 12px 30px #0008,inset 0 0 18px #38bdf822; cursor:pointer; }
    .speaker { position:absolute; top:-17px; left:20px; padding:4px 14px; border:2px solid #bae6fd; border-radius:9px; background:#0369a1; font-weight:800; font-size:.92rem; }
    .dialog-text { margin:0; min-height:52px; font-size:clamp(1rem,2.4vw,1.28rem); line-height:1.55; white-space:pre-wrap; }
    .dialog-text.typing::after { content:'▼'; display:inline-block; margin-left:7px; color:var(--cyan); font-size:.72em; animation:blink 1s steps(2) infinite; }
    @keyframes blink { 50%{opacity:0} }
    .glitch { color:#ff5b73; font-family:monospace; text-shadow:2px 2px #0ff,-2px -2px #f0f; animation:jitter .18s linear infinite; }
    @keyframes jitter { 25%{transform:translate(1px,-1px)} 50%{transform:translate(-1px,1px)} 75%{transform:translate(1px,1px)} }
    .screen { position:absolute; z-index:5; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(20px,5vw,56px); text-align:center; background:linear-gradient(135deg,#0b1222ed,#14223be8); overflow:auto; }
    .screen.hidden { display:none; }
    .start-card { max-width:790px; padding:clamp(24px,5vw,54px); border:1px solid #ffffff35; border-radius:28px; background:#0509149c; backdrop-filter:blur(12px); box-shadow:0 20px 60px #0007; }
    h1 { margin:0 0 14px; font-size:clamp(2.2rem,7vw,5rem); line-height:1.05; font-weight:900; letter-spacing:-.04em; color:#a5f3fc; text-shadow:0 5px 24px #0284c788; }
    .subtitle { margin:0 0 28px; font-size:clamp(1rem,2.7vw,1.35rem); color:#dbeafe; font-style:italic; }
    .primary { padding:13px 30px; border:0; border-radius:999px; background:#0284c7; color:white; cursor:pointer; font-weight:900; font-size:1.12rem; box-shadow:0 0 25px #0284c788; transition:transform .15s,background .15s; }
    .primary:hover,.primary:focus-visible { transform:scale(1.04); background:#0ea5e9; outline:2px solid #bae6fd; }
    .ending-card { width:min(100%,820px); padding:clamp(22px,4vw,42px); border-radius:24px; border:1px solid #ffffff55; background:#08111de8; backdrop-filter:blur(12px); box-shadow:0 20px 60px #0008; }
    .ending-card h2 { margin:8px 0 15px; font-size:clamp(1.9rem,5vw,3.3rem); }
    .ending-card p { color:#e2e8f0; line-height:1.65; font-size:clamp(1rem,2.3vw,1.2rem); }
    .ending-badge { color:#7dd3fc; font-weight:900; text-transform:uppercase; letter-spacing:.16em; font-size:.8rem; }
    .final-stats { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:20px 0 25px; }
    .final-stats span { padding:9px 14px; border-radius:10px; background:#172235; }
    .final-stats b { color:#bae6fd; }
    .hint { margin-top:14px; color:#cbd5e1; font-size:.85rem; }
    @media (max-height:620px) { .game{min-height:0} .spark{top:22%;width:145px} .scene-title{top:65px} .bottom-ui{gap:8px;padding-top:12px} .dialog{min-height:90px;padding:20px 17px 13px} .dialog-text{min-height:40px} }
    @media (max-width:520px) { body{display:block} .game{width:100%;height:100vh;height:100dvh;min-height:0} .hud{justify-content:flex-start;padding:11px 9px;gap:6px} .stat{font-size:.72rem;padding:6px 9px;gap:5px} .scene-title{top:65px} .spark{top:25%;width:155px} .bottom-ui{padding:18px 12px max(16px,env(safe-area-inset-bottom))} .dialog{min-height:105px;border-width:2px;padding:22px 15px 12px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <main id="game" class="game" aria-label="The City That Lost Its Thought interactive story">
    <div id="backdrop" class="backdrop bg-city-day" aria-hidden="true"></div>
    <div id="hud" class="hud hidden" aria-live="polite"><div class="stat">Dependence <b id="stat-dep">0</b></div><div class="stat thinking">Thinking <b id="stat-think">0</b></div></div>
    <div id="scene-title" class="scene-title hidden"></div>
    <div id="spark" class="spark hidden" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="100" rx="90" ry="30" stroke="#bae6fd" stroke-width="2" stroke-dasharray="10 10" transform="rotate(20 100 100)"/>
        <ellipse cx="100" cy="100" rx="90" ry="30" stroke="#bae6fd" stroke-width="2" stroke-dasharray="10 10" transform="rotate(-20 100 100)"/>
        <circle cx="100" cy="100" r="60" fill="white" stroke="#38bdf8" stroke-width="8"/>
        <circle cx="80" cy="90" r="10" fill="#0f172a"/><circle cx="120" cy="90" r="10" fill="#0f172a"/>
        <path d="M85 120 Q100 130 115 120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
        <circle cx="100" cy="20" r="15" fill="#facc15"/><path d="M100 35 L100 40" stroke="#facc15" stroke-width="4"/>
      </svg>
    </div>
    <section id="start-screen" class="screen"><div class="start-card"><h1>The City That<br>Lost Its Thought</h1><p class="subtitle">An Interactive Story about AI Literacy</p><button id="start-button" class="primary" type="button">Start Game</button><p class="hint">Tap the dialogue to continue. Your choices shape the ending.</p></div></section>
    <section id="story-ui" class="bottom-ui hidden" aria-label="Story dialogue"><div id="choices" class="choices" aria-label="Choices"></div><div id="dialog" class="dialog" role="button" tabindex="0" aria-label="Continue dialogue"><div id="speaker" class="speaker">Narrator</div><p id="dialog-text" class="dialog-text"></p></div></section>
    <section id="ending-screen" class="screen hidden" aria-live="polite"><div class="ending-card"><div id="ending-badge" class="ending-badge">Your Ending</div><h2 id="ending-title"></h2><p id="ending-desc"></p><p id="ending-message"></p><div class="final-stats"><span>Dependence: <b id="final-dep">0</b></span><span>Thinking: <b id="final-think">0</b></span></div><button id="restart-button" class="primary" type="button">Play Again</button></div></section>
  </main>
<script>
  const story = [
    {title:"The Smart City",bg:"bg-city-day",showSpark:false,dialogs:[
      {speaker:"Narrator",text:"The year is 2050. Welcome to 'Smart City'."},
      {speaker:"Narrator",text:"Here, every student has a powerful AI assistant."},
      {speaker:"Narrator",text:"Homework, drawings, essays, game guides... the AI gives the answer immediately."},
      {speaker:"Narrator",text:"Slowly, the citizens are stopping to think for themselves."},
      {speaker:"Narrator",text:"Today, you received the newest AI model."}],choices:[{text:"Turn on the AI.",nextScene:1}]},
    {title:"Chapter 1 · The Water Plan",bg:"bg-classroom",showSpark:true,dialogs:[
      {speaker:"Spark",text:"Hello! I am Spark, your new AI assistant. I can solve any problem!"},
      {speaker:"Teacher",text:"Class, your homework today is: 'Design a plan to save water in our city.'"},
      {speaker:"Spark",text:"Ding! I have generated a perfect, 10-page water-saving plan for you. It guarantees an A+."}],choices:[
      {text:"A. Copy Spark's answer directly. It's easy!",score:0,nextScene:2},
      {text:"B. Read Spark's answer, change it, and add my own ideas.",score:1,nextScene:2},
      {text:"C. Think of my own ideas first, then ask Spark to organize them.",score:2,nextScene:2}]},
    {title:"Chapter 2 · The Science Competition",bg:"bg-lab",showSpark:true,dialogs:[
      {speaker:"Narrator",text:"A few weeks later, you are in the School Science Competition."},
      {speaker:"Teammate",text:"Wait... the experiment method Spark gave us looks wrong. It might explode!"},
      {speaker:"Spark",text:"Trust me. My database shows a 99% success rate. Do not worry."}],choices:[
      {text:"A. Follow Spark. Ignore the teammate.",score:0,nextScene:3},
      {text:"B. Check the information online and verify it myself.",score:1,nextScene:3},
      {text:"C. Discuss with my teammates and compare different methods.",score:2,nextScene:3}]},
    {title:"Chapter 3 · Hin's Anger",bg:"bg-park",showSpark:true,dialogs:[
      {speaker:"Narrator",text:"After school, your best friend Hin looks very angry with you."},
      {speaker:"Hin",text:"I can't believe you didn't wait for me!"},
      {speaker:"Spark",text:"Scanning human emotions... Analyzing... Best plan: Ignore him until his anger level decreases."}],choices:[
      {text:"A. Follow Spark's advice. Ignore Hin.",score:0,nextScene:4},
      {text:"B. Keep asking Spark for more opinions. Then, talk to Hin the next day.",score:1,nextScene:4},
      {text:"C. Don't use AI. Go and talk to Hin face-to-face.",score:2,nextScene:4}]},
    {title:"Chapter 4 · Blackout",bg:"bg-blackout",showSpark:true,dialogs:[
      {speaker:"Narrator",text:"One night, the lights flicker."},
      {speaker:"Narrator",text:"Then, the whole city loses power. The internet disappears."},
      {speaker:"Spark",text:"CONNECTION LOST... CONNECTION LOST...",glitch:true},
      {speaker:"Spark",text:"SYSTEM SHUTDOWN.",glitch:true}],choices:[{text:"What will happen to the city?",nextScene:5}]},
    {title:"Chapter 5 · Three Days Later",bg:"bg-ruins",showSpark:false,dialogs:[
      {speaker:"Narrator",text:"Three days later. The AI is still broken."},
      {speaker:"Narrator",text:"Everyone has big problems. They don't know how to do math, plan food, fix machines, or make decisions."},
      {speaker:"Narrator",text:"It is time to see how you survived..."}],choices:[{text:"View my Ending",ending:true}]}
  ];
  const state={dependence:0,thinking:0,scene:0,line:0,typing:false,timer:null,token:0};
  const $=id=>document.getElementById(id);
  function updateStats(){ $('stat-dep').textContent=state.dependence; $('stat-think').textContent=state.thinking; }
  function startGame(){
    state.dependence=0; state.thinking=0; state.line=0; updateStats();
    $('start-screen').classList.add('hidden'); $('ending-screen').classList.add('hidden');
    $('hud').classList.remove('hidden'); $('story-ui').classList.remove('hidden'); loadScene(0);
  }
  function loadScene(index){
    clearTimeout(state.timer); state.token++; state.scene=index; state.line=0;
    const scene=story[index]; $('backdrop').className='backdrop '+scene.bg;
    $('scene-title').textContent=scene.title; $('scene-title').classList.remove('hidden');
    $('spark').classList.toggle('hidden',!scene.showSpark); $('choices').replaceChildren(); showDialog();
  }
  function showDialog(){
    const scene=story[state.scene],dialog=scene.dialogs[state.line],token=++state.token;
    if(scene.title==="Chapter 4 · Blackout" && state.line>=2) $('backdrop').className='backdrop bg-connection-lost';
    state.typing=!dialog.glitch; $('speaker').textContent=dialog.speaker;
    const text=$('dialog-text'); text.textContent=''; text.classList.toggle('glitch',!!dialog.glitch); text.classList.toggle('typing',!dialog.glitch);
    if(dialog.glitch){ text.textContent=dialog.text; state.typing=false; revealChoices(); return; }
    let char=0;
    const typeNext=()=>{
      if(token!==state.token) return;
      if(char<dialog.text.length){ text.textContent+=dialog.text.charAt(char++); state.timer=setTimeout(typeNext,24); }
      else { state.typing=false; text.classList.remove('typing'); revealChoices(); }
    };
    typeNext();
  }
  function revealChoices(){
    const scene=story[state.scene]; $('choices').replaceChildren();
    if(state.line!==scene.dialogs.length-1||state.typing) return;
    for(const choice of scene.choices){
      const button=document.createElement('button'); button.type='button'; button.className='choice'; button.textContent=choice.text;
      button.addEventListener('click',()=>makeChoice(choice)); $('choices').append(button);
    }
  }
  function advanceDialog(){
    if($('story-ui').classList.contains('hidden')) return;
    if(state.typing){ clearTimeout(state.timer); state.token++; const current=story[state.scene].dialogs[state.line]; $('dialog-text').textContent=current.text; $('dialog-text').classList.remove('typing'); state.typing=false; revealChoices(); return; }
    const scene=story[state.scene]; if(state.line<scene.dialogs.length-1){state.line++;showDialog();}
  }
  function makeChoice(choice){
    if(choice.score!==undefined){state.dependence+=choice.score;state.thinking+=choice.score;updateStats();}
    if(choice.ending){showEnding();return;} loadScene(choice.nextScene);
  }
  function showEnding(){
    clearTimeout(state.timer); state.token++; $('story-ui').classList.add('hidden'); $('hud').classList.add('hidden'); $('scene-title').classList.add('hidden'); $('spark').classList.add('hidden');
    $('ending-screen').classList.remove('hidden');
    const title=$('ending-title'),desc=$('ending-desc'),message=$('ending-message');
    if(state.thinking===6){
      $('backdrop').className='backdrop bg-future'; $('ending-badge').textContent='🌟 True Ending'; title.textContent='The Creator'; title.style.color='#fde047';
      desc.textContent="The AI finally comes back. The Mayor invites you to rebuild the city! You tell the Mayor: 'AI should not think FOR people. It should help people think.' A new AI is built—not to replace people, but to help them learn, create, and work together.";
      message.textContent="The best user doesn't depend on AI; they think together with AI.";
    } else if(state.thinking===5){
      $('backdrop').className='backdrop bg-ruins'; $('ending-badge').textContent='Ending 3'; title.textContent='✅ The Wise User'; title.style.color='#4ade80';
      desc.textContent="Many people are lost without the internet, but you are different. You start to analyze problems, find books for information, organize your classmates, and work together to help the city recover.";
      message.textContent='AI is a magnifying glass, not a brain. Your own thinking is what truly matters.';
    } else if(state.thinking>=3){
      $('backdrop').className='backdrop bg-ruins'; $('ending-badge').textContent='Ending 2'; title.textContent='⚠️ The Half-Dependent'; title.style.color='#facc15';
      desc.textContent="The AI is gone, but you still remember some things. You can survive, but it is very hard. When you face complex problems, you still wait for an easy answer and struggle to trust your own ideas.";
      message.textContent='AI can help me, but it cannot grow up for me.';
    } else {
      $('backdrop').className='backdrop bg-blackout'; $('ending-badge').textContent='Ending 1'; title.textContent='❌ The Unthinking Person'; title.style.color='#f87171';
      desc.textContent="You find it very hard to make decisions. You wait for the AI to come back. You can't even answer simple questions like 'How do we share the food?' or 'Where is the clean water?' Slowly, you realize that thinking is a skill you must practice.";
      message.textContent='When we give our thinking to tools, we might lose our ability to think.';
    }
    $('final-dep').textContent=state.dependence; $('final-think').textContent=state.thinking;
  }
  $('start-button').addEventListener('click',startGame); $('restart-button').addEventListener('click',startGame);
  $('dialog').addEventListener('click',advanceDialog);
  $('dialog').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();advanceDialog();}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape') return;});
</script>
</body>
</html>
